# Welle 186: alle Prüfskripte (npm run verify:alle) bei jedem Push auf main und täglich,
# je einmal in deutscher Zeit und in UTC. Welle 191: dazu New York — westlich von UTC ist
# new Date('JJJJ-MM-TT') noch der Vortag, das sieht weder Berlin noch UTC.
# Ein roter Lauf blockiert kein Deploy (Vercel baut unabhängig davon); GitHub meldet ihn per E-Mail.
# Siehe CLAUDE.md, Abschnitt „Prüfskripte“.
name: Prüfskripte

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    # täglich 04:17 UTC = 06:17 Uhr MESZ bzw. 05:17 Uhr MEZ; fängt Stichtage ohne Code-Änderung
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify:alle (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Berlin, UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      # Welle 191: v7 statt v4 (läuft auf Node 24; v4 lief auf Node 20, GitHub warnte)
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Ohne Installationsskripte: Die Prüfskripte brauchen weder ffmpeg noch exiftool.
      - run: npm ci --ignore-scripts
      - run: npm run verify:alle
